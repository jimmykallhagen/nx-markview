<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nordix Markview</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin-top: 40px;
            background-color: #1e2127ff;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 2rem 4rem;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.7;
            -webkit-app-region: drag;
        }

        h1, h2, h3 {
            color: #8fcbffff;
            margin: 1.5rem 0 0.75rem;
        }

        a {
            color: #8fcbffff;
        }

        code {
            background: #2c313a;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
            color: #98c379;
        }

        pre {
            background: #2c313a;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid #3e4451;
        }

        pre code {
            background: none;
            padding: 0;
            color: #9ce6ffff;
        }

        blockquote {
            border-left: 3px solid #11d1f5;
            padding: 0.5rem 1rem;
            color: #9ce6ffff;
            margin: 1rem 0;
            background: #2c313a;
            border-radius: 0 4px 4px 0;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
            border-radius: 2px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #3e4451;
            padding: 0.5rem 1rem;
        }

        th {
            background: #8fcbff66;
            color: #9ce6ffff;
        }

        th:first-child, td:first-child {
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }

        th:last-child, td:last-child {
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        hr {
            border: none;
            border-top: 2px solid #9ce6ffaa;
            margin: 2rem 0;
        }

        #error {
            color: #e16c75;
            background: #2c313a;
            padding: 1rem;
            border-radius: 6px;
            border-left: 3px solid #e06c75;
            display: none;
        }

        /* ===== TITLE BAR ===== */
        #titlebar {
            background: #2c313a;
            color: #81d1f1;
            font-family: monospace;
            font-size: 0.85rem;
            padding: 0.4rem 1rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            -webkit-app-region: drag;
            z-index: 100;
            display: flex;
            align-items: center;
            border-bottom: 2px solid #3e4451;
            height: 40px;
        }

        /* ===== LEFT SIDE: ZOOM BUTTONS ===== */
        .zoom-buttons {
            display: flex;
            gap: 4px;
        }

        /* ===== MIDDLE: APP NAME ===== */
        #app-name {
            font-weight: bold;
            color: #81d1f1;
            font-family: monospace;
            font-size: 1rem;
            flex-grow: 1;
            text-align: center;
            margin: 0 1rem;
        }

        /* ===== RIGHT SIDE: CLOSE BUTTON ===== */
        .close-btn {
            background: transparent;
            border: 1px solid #e06c75;
            color: #e06c75;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            -webkit-app-region: no-drag;
            transition: all 0.2s ease;
            margin-left: auto;
        }

        .close-btn:hover {
            background-color: #e06c75;
            color: #2c313a;
        }

        /* ===== ZOOM BUTTONS ===== */
        .zoom-btn {
            background: transparent;
            border: 1px solid #3e4451;
            color: #81d1f1;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-app-region: no-drag;
        }

        .zoom-btn:hover {
            background-color: #3e4451;
            color: #ffffff;
            border-color: #11d1f5;
        }

        #content-area {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="titlebar">
        <div class="zoom-buttons">
            <button class="zoom-btn" id="btn-zoom-out" title="Zoom Out (-)">-</button>
            <button class="zoom-btn" id="btn-zoom-in" title="Zoom In (+)">+</button>
        </div>
        <span id="app-name">Nordix Markview</span>
        <button class="close-btn" id="btn-close" title="Close Window (X)">✕</button>
    </div>

    <div id="content-area">
        <div id="error" style="color: #e16c75; background: #2c313a; padding: 1rem; border-radius: 6px; border-left: 3px solid #e06c75; display: none;"></div>
    </div>

    <script>
        const { readTextFile } = window.__TAURI__.fs;
        const { getCurrentWindow } = window.__TAURI__.window;

        const contentArea = document.getElementById('content-area');
        const errorDiv = document.getElementById('error');
        const closeBtn = document.getElementById('btn-close');
        const zoomOutBtn = document.getElementById('btn-zoom-out');
        const zoomInBtn = document.getElementById('btn-zoom-in');
        const appWindow = getCurrentWindow();

        closeBtn.addEventListener('click', () => {
            appWindow.close();
        });

        let currentFontSize = 16;
        const MIN_SIZE = 12;
        const MAX_SIZE = 32;

        zoomInBtn.addEventListener('click', () => {
            if (currentFontSize < MAX_SIZE) {
                currentFontSize += 2;
                document.body.style.fontSize = currentFontSize + 'px';
            }
        });

        zoomOutBtn.addEventListener('click', () => {
            if (currentFontSize > MIN_SIZE) {
                currentFontSize -= 2;
                document.body.style.fontSize = currentFontSize + 'px';
            }
        });

        async function init() {
            try {
                const matches = await window.__TAURI__.cli.getMatches();
                const filePath = matches.args.file?.value;

                if (!filePath) {
                    errorDiv.textContent = 'Usage: nx-markview /path/to/file.md';
                    errorDiv.style.display = 'block';
                } else {
                    const text = await readTextFile(filePath);
                    marked.setOptions({ gfm: true, breaks: true, sanitize: false });
                    const html = marked.parse(text);
                    contentArea.innerHTML = html;
                }
            } catch (e) {
                errorDiv.textContent = 'Error: ' + e;
                errorDiv.style.display = 'block';
            }
        }

        init();
    </script>
</body>
</html>
